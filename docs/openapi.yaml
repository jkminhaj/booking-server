  /health:
    get:
      tags: [Health]
      summary: Service and database health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { status: { type: string, example: ok }, database: { type: string, example: ok }, environment: { type: string, example: development }, timestamp: { type: string, format: date-time } } } } }]
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { status: { type: string, example: error }, database: { type: string, example: error } } } } }]
