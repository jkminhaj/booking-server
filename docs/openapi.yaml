            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Appointment' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } }]
        '401': { $ref: '#/components/responses/Unauthorized' }

  /appointments/staff/{staffId}:
    get:
      tags: [Appointments]
      summary: Get a staff member's appointments
      description: STAFF-role callers may only request their own staffId.
      parameters:
        - name: staffId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Appointment' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /appointments/customer/{customerId}:
    get:
      tags: [Appointments]
      summary: Get a customer's appointments
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Appointment' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } }]
        '401': { $ref: '#/components/responses/Unauthorized' }
  /public/business/{slug}:
    get:
      tags: [Public Booking]
      summary: Get public business info
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: apex-barbers }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/PublicBusiness' } } }]
        '404': { $ref: '#/components/responses/NotFound' }

  /public/business/{slug}/categories:
    get:
      tags: [Public Booking]
      summary: Get active service categories
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ServiceCategory' } } } }]
        '404': { $ref: '#/components/responses/NotFound' }

  /public/business/{slug}/services:
    get:
      tags: [Public Booking]
      summary: Get active services
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Service' } } } }]
        '404': { $ref: '#/components/responses/NotFound' }

  /public/business/{slug}/staff:
    get:
      tags: [Public Booking]
      summary: Get active staff, optionally filtered to those performing a service
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: serviceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string }, image: { type: string, nullable: true } } } } } }]
        '404': { $ref: '#/components/responses/NotFound' }

  /public/business/{slug}/availability:
    get:
      tags: [Public Booking]
      summary: Find available booking slots
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: serviceId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          schema: { type: string, example: "2026-09-01" }
        - name: staffId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AvailabilityResult' } } }]
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/business/{slug}/appointments:
    post:
      tags: [Public Booking]
      summary: Create a booking
      description: |
        Unauthenticated — this is what the customer-facing booking page
        calls. Finds-or-creates the Customer by email, then goes through
        the exact same conflict/working-hours validation as an
        authenticated booking. Rate-limited to 30/hour per IP.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, staffId, startAt, customer]
              properties:
                serviceId: { type: string, format: uuid }
                staffId: { type: string, format: uuid }
                startAt: { type: string, format: date-time }
                notes: { type: string }
                customer:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    email: { type: string, format: email }
                    phone: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Appointment' } } }]
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The slot is unavailable — outside working hours, blocked, or already booked.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /payments/create-intent:
    post:
      tags: [Payments]
      summary: Create a Stripe PaymentIntent for an appointment
      description: |
        Unauthenticated — the customer paying from the booking page has no
        staff account. Only works against a real, unpaid appointmentId.
        Rate-limited to 30/hour per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [appointmentId], properties: { appointmentId: { type: string, format: uuid } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { clientSecret: { type: string, description: Pass to Stripe.js on the frontend to collect card details. } } } } }]
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This appointment has already been paid.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /payments:
    get:
      tags: [Payments]
      summary: List payments
      description: Requires OWNER, ADMIN, MANAGER, or RECEPTIONIST.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaymentStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Payment' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Payments]
      summary: Record a manual payment
      description: Requires OWNER, ADMIN, MANAGER, or RECEPTIONIST. Typically CASH taken in person — CARD payments normally arrive via the Stripe webhook instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointmentId, amount, method]
              properties:
                appointmentId: { type: string, format: uuid }
                amount: { type: number, minimum: 0 }
                method: { $ref: '#/components/schemas/PaymentMethod' }
                transactionRef: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Payment' } } }]
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/{id}:
    get:
      tags: [Payments]
      summary: Get a payment
      description: Requires OWNER, ADMIN, MANAGER, or RECEPTIONIST.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Payment' } } }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Payments]
      summary: Update a payment record
      description: Requires OWNER, ADMIN, MANAGER, or RECEPTIONIST. CARD payment status cannot be edited here (it's driven by the Stripe webhook) — use the refund endpoint instead.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/PaymentStatus' }
                transactionRef: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Payment' } } }]
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{id}/refund:
    post:
      tags: [Payments]
      summary: Refund a payment
      description: Requires OWNER, ADMIN, or MANAGER. For CARD payments this calls the Stripe Refunds API; for CASH it just updates the record. Omit amount for a full refund.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number, minimum: 0, description: Omit for a full refund. }
                reason: { type: string, enum: [duplicate, fraudulent, requested_by_customer] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Payment' } } }]
        '400':
          description: Only a paid payment can be refunded.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/appointment/{appointmentId}:
    get:
      tags: [Payments]
      summary: Get payments for an appointment
      description: Requires OWNER, ADMIN, MANAGER, or RECEPTIONIST.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Payment' } } } }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/webhook:
    post:
      tags: [Payments]
      summary: Stripe webhook (Stripe calls this — not for direct use)
      description: |
        Verifies the `Stripe-Signature` header against the raw request body.
        Registered ahead of JSON body parsing in app.js for that reason.
        The only place a CARD payment is ever marked PAID.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string, format: binary, description: Raw Stripe event payload. }
      responses:
        '200':
          description: Event processed (or safely ignored).
          content: { application/json: { schema: { type: object, properties: { received: { type: boolean } } } } }
        '400':
          description: Signature verification failed.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

