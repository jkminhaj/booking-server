                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { type: object, properties: { service: { $ref: '#/components/schemas/Service' }, completedCount: { type: integer } } } } } }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dashboard/staff:
    get:
