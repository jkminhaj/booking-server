  /appointments:
    get:
      tags: [Appointments]
      summary: List appointments
      description: STAFF-role callers always see only their own appointments, regardless of the staffId filter.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: date
          in: query
          schema: { type: string, example: "2026-09-01" }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AppointmentStatus' }
        - name: staffId
          in: query
          schema: { type: string, format: uuid }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Appointment' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } }]
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Appointments]
      summary: Create an appointment
      description: |
        Requires OWNER, ADMIN, MANAGER, or RECEPTIONIST. Runs inside a
        SERIALIZABLE transaction and re-validates working hours + conflicts
        at write time — a prior /availability check is never trusted alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, staffId, serviceId, startAt]
              properties:
                customerId: { type: string, format: uuid }
                staffId: { type: string, format: uuid }
                serviceId: { type: string, format: uuid }
                startAt: { type: string, format: date-time }
                notes: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Appointment' } } }]
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The slot is unavailable — outside working hours, blocked, or already booked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { success: false, error: { code: APPOINTMENT_CONFLICT, message: "This time slot conflicts with an existing appointment." } }

  /appointments/{id}:
    get:
      tags: [Appointments]
      summary: Get an appointment
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Appointment' } } }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Appointments]
      summary: Update an appointment
      description: Requires OWNER, ADMIN, MANAGER, or RECEPTIONIST. Changing staffId/serviceId/startAt re-validates availability (same conflict protection as creation); changing only notes does not.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                staffId: { type: string, format: uuid }
                serviceId: { type: string, format: uuid }
                startAt: { type: string, format: date-time }
                notes: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Appointment' } } }]
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Appointments]
      summary: Delete an appointment
      description: Requires OWNER, ADMIN, MANAGER, or RECEPTIONIST. Rejected (409) if a payment record exists — cancel it instead (POST /appointments/{id}/cancel).
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/MessageOnly' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appointments/{id}/status:
    patch:
      tags: [Appointments]
      summary: Change appointment status directly
      description: |
        Requires OWNER, ADMIN, MANAGER, or RECEPTIONIST. Only certain
        transitions are allowed: PENDING -> CONFIRMED/CANCELLED/NO_SHOW,
        CONFIRMED -> COMPLETED/CANCELLED/NO_SHOW. COMPLETED/CANCELLED/NO_SHOW
        are terminal. Prefer the dedicated /cancel, /confirm, /complete,
        /no-show endpoints below for clarity.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/AppointmentStatus' } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Appointment' } } }]
        '400':
          description: Invalid transition, or validation error.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /appointments/{id}/cancel:
    post:
      tags: [Appointments]
      summary: Cancel an appointment
      description: Requires OWNER, ADMIN, MANAGER, or RECEPTIONIST. Sets cancelledAt and, if provided, cancellationReason. Does not automatically refund — use POST /payments/{id}/refund separately if needed.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        content:
          application/json:
