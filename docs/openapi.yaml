openapi: 3.1.0
info:
  title: Booking SaaS API
  version: "1.0.0"
  description: |
    Multi-tenant booking API for barbershops, salons, gyms, and clinics.

    ## Auth
    Two-token JWT flow. `POST /auth/login` (or `/auth/register`) returns an
    **access token** in the response body — send it as `Authorization: Bearer <token>`
    on every authenticated request — and sets a **refresh token** as an httpOnly
    cookie. When the access token expires (15 min), call `POST /auth/refresh`
    (browser sends the cookie automatically) to get a new one.

    ## Envelope
    Every response is `{ "success": true, "data": ... }` or
    `{ "success": false, "error": { "code", "message" } }`. Paginated list
    endpoints add a `meta: { page, limit, total }` object alongside `data`.

    ## Multi-tenancy
    Everything under a business is scoped automatically from your access
    token — there is no `businessId` to pass yourself, and you cannot see or
    modify another business's data.

    ## Rate limits
    General: 300 req / 15 min per IP. Login/register: 10 (resp. 5) per
    15 min–1 hour. Public booking creation & payment-intent creation: 30/hour.
  contact:
    name: Rixelio
servers:
  - url: http://localhost:3000/api
    description: Local development
tags:
  - name: Auth
    description: Registration, login, session refresh, and your own profile.
  - name: Business
    description: The current tenant's own business record.
  - name: Staff
    description: Team members (users) belonging to the business.
  - name: Customers
    description: A business's contact records for the people it serves.
  - name: Service Categories
    description: Groupings used to organize services on the booking page.
  - name: Services
    description: The bookable services a business offers.
  - name: Staff Services
    description: Which staff perform which services, with optional per-staff overrides.
  - name: Working Hours
    description: The recurring weekly schedule, business-wide or per staff member.
  - name: Schedule Overrides
    description: One-off exceptions to working hours (holidays, shortened days).
  - name: Blocked Times
    description: Ad-hoc unavailable periods (breaks, meetings, personal time).
  - name: Availability
    description: The scheduling engine — read-only slot lookups for the dashboard.
  - name: Appointments
    description: Bookings, their lifecycle, and conflict-protected creation.
  - name: Public Booking
    description: Unauthenticated endpoints powering the customer-facing booking page.
  - name: Payments
    description: Payment records, Stripe payment intents, refunds, and the webhook.
  - name: Dashboard
    description: Aggregate stats for the business (manager role and up).
  - name: Health
    description: Service and database status.
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /auth/login, /auth/register, or /auth/refresh.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 42 }

    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Validation failed }
            details:
              type: array
              items:
                type: object
                properties:
                  path: { type: string, example: body.email }
                  message: { type: string, example: Invalid email }

    MessageOnly:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            message: { type: string }

    Role:
      type: string
      enum: [OWNER, ADMIN, MANAGER, STAFF, RECEPTIONIST]
    AppointmentStatus:
      type: string
      enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW]
    PaymentStatus:
      type: string
      enum: [PENDING, PAID, FAILED, REFUNDED, PARTIALLY_REFUNDED]
    PaymentMethod:
      type: string
      enum: [CARD, CASH, OTHER]

    Business:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Apex Barbers }
        slug: { type: string, example: apex-barbers }
        timezone: { type: string, example: Europe/London }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PublicBusiness:
      type: object
      description: The subset of Business fields exposed on the public booking page.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        timezone: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }

    User:
      type: object
      description: A staff member. Never includes passwordHash, tokenVersion, or firebaseId.
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        image: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ServiceCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Service:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        durationMinutes: { type: integer, example: 45 }
        bufferMinutes: { type: integer, example: 10 }
        price: { type: string, example: "30.00", description: Decimal, serialized as a string. }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StaffService:
      type: object
      properties:
        id: { type: string, format: uuid }
        staffId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        customPrice: { type: string, nullable: true }
        customDuration: { type: integer, nullable: true }
        isActive: { type: boolean }

    WorkingHours:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        staffId: { type: string, format: uuid, nullable: true, description: "null = business-level default" }
        dayOfWeek: { type: integer, minimum: 0, maximum: 6, description: "0 = Sunday .. 6 = Saturday" }
        startTime: { type: string, example: "09:00" }
        endTime: { type: string, example: "17:00" }

    ScheduleOverride:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        staffId: { type: string, format: uuid, nullable: true }
        date: { type: string, example: "2026-12-25" }
        isClosed: { type: boolean }
        startTime: { type: string, nullable: true, example: "10:00" }
        endTime: { type: string, nullable: true, example: "15:00" }
        reason: { type: string, nullable: true, example: Christmas }

    BlockedTime:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        staffId: { type: string, format: uuid, nullable: true, description: "null = business-wide" }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        reason: { type: string, nullable: true }

    Appointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        staffId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        priceAtBooking: { type: string, example: "30.00" }
        notes: { type: string, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancellationReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        customer: { $ref: '#/components/schemas/Customer' }
        staff:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        service: { $ref: '#/components/schemas/Service' }

    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        appointmentId: { type: string, format: uuid }
        amount: { type: string, example: "30.00" }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        transactionRef: { type: string, nullable: true, description: Stripe PaymentIntent id for CARD payments. }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AvailabilityResult:
      type: object
      properties:
        date: { type: string, example: "2026-09-01" }
        service:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            durationMinutes: { type: integer }
            bufferMinutes: { type: integer }
        staff:
          type: array
          items:
            type: object
            properties:
              staffId: { type: string, format: uuid }
              name: { type: string }
              slots:
                type: array
                items:
                  type: object
                  properties:
                    startAt: { type: string, format: date-time }
                    endAt: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, error: { code: UNAUTHORIZED, message: Invalid or expired access token } }
    Forbidden:
      description: Authenticated, but not allowed to perform this action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, error: { code: FORBIDDEN, message: You do not have permission to perform this action } }
    NotFound:
      description: No such resource in this business.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, error: { code: NOT_FOUND, message: Resource not found } }
    ValidationError:
      description: Request body, query, or params failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, error: { code: VALIDATION_ERROR, message: Validation failed, details: [{ path: "body.email", message: Invalid email }] } }
    Conflict:
      description: The request conflicts with the resource's current state (duplicate, already booked, etc).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, error: { code: TOO_MANY_REQUESTS, message: Too many requests. Please try again later. } }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new business + its owner
      description: Creates a Business and its first User (role OWNER) together, in one transaction. Sets the refresh-token cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business, owner]
              properties:
                business:
                  type: object
                  required: [name, email]
                  properties:
                    name: { type: string, minLength: 2 }
                    email: { type: string, format: email }
                    phone: { type: string }
                    timezone: { type: string, example: Europe/London, description: Defaults to Europe/London if omitted. }
                owner:
                  type: object
                  required: [name, email, password]
                  properties:
                    name: { type: string, minLength: 2 }
                    email: { type: string, format: email }
                    password: { type: string, minLength: 8, format: password }
                    phone: { type: string }
      responses:
        '201':
          description: Created
          headers:
            Set-Cookie: { schema: { type: string }, description: "refreshToken=...; HttpOnly; Path=/api/auth" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange the refresh-token cookie for a new access token
      description: Reads the httpOnly refreshToken cookie (no Authorization header needed) and rotates it.
      security: []
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Invalidates every refresh token issued before now (bumps tokenVersion) and clears the cookie.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/MessageOnly' } }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get your own user + business
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/profile:
    patch:
      tags: [Auth]
      summary: Update your own name / phone / image
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                phone: { type: string }
                image: { type: string, format: uri }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    patch:
      tags: [Auth]
      summary: Change your own password
      description: Also bumps tokenVersion — you'll be logged out on every other device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, minLength: 8, format: password }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/MessageOnly' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /business:
    get:
      tags: [Business]
      summary: Get the current business
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Business' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Business]
      summary: Update business info
      description: Requires OWNER or ADMIN.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                email: { type: string, format: email }
                phone: { type: string }
                timezone: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Business' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /business/status:
    patch:
      tags: [Business]
      summary: Activate or deactivate the business
      description: Requires OWNER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties: { isActive: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Business' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users:
    get:
      tags: [Staff]
      summary: List staff
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/User' } }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Staff]
      summary: Add a staff member
      description: Requires OWNER, ADMIN, or MANAGER. `role` cannot be OWNER (created only via /auth/register).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, format: password, description: Initial password — share it with the staff member out of band. }
                role: { type: string, enum: [ADMIN, MANAGER, STAFF, RECEPTIONIST] }
                phone: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/User' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}:
    get:
      tags: [Staff]
      summary: Get a staff member
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Staff]
      summary: Update a staff member's name / phone / image
      description: Requires OWNER, ADMIN, or MANAGER.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                phone: { type: string }
                image: { type: string, format: uri }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }]
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Staff]
      summary: Remove a staff member
      description: Requires OWNER or ADMIN. The database rejects this (409) if the staff member has any appointment history — deactivate via PATCH /users/{id}/status instead.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/MessageOnly' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}/role:
    patch:
      tags: [Staff]
      summary: Change a staff member's role
      description: Requires OWNER or ADMIN. Cannot change the owner's own role.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties: { role: { type: string, enum: [ADMIN, MANAGER, STAFF, RECEPTIONIST] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/status:
